<style>
  #ae-floating-chat-button {
    position:fixed;
    right:24px;
    bottom:28px;
    z-index:9999;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 22px 10px 10px;
    border:1px solid #d7b87590;
    border-radius:999px;
    background:#151612;
    color:#f2eee5;
    box-shadow:0 10px 40px #0006;

    text-transform:none;
    letter-spacing:normal;
    cursor:pointer;
    box-sizing:border-box;
  }
  #ae-floating-chat-button:hover { border-color:#d7b875; background:#24261f; }
  #ae-floating-chat-button:focus-visible,
  #ae-side-panel-close:focus-visible { outline:2px solid #d7b875; outline-offset:4px; }
  #ae-floating-chat-button img {
    display:block;
    width:42px;
    height:42px;
    border:1px solid #d7b875;
    border-radius:50%;
    object-fit:cover;
    flex:none;
    box-sizing:border-box;
  }
  #ae-floating-chat-button strong { display:block; font-size:17px; font-weight:600; }
  #ae-floating-chat-button small { display:block; color:#d7b875; font-size:11px; letter-spacing:.06em; }

  #ae-side-panel {
    box-sizing:border-box;
    position:fixed;
    inset:0 0 0 auto;
    margin:0;
    width:45vw;
    max-width:100vw;
    height:100vh;
    height:100dvh;
    max-height:100vh;
    max-height:100dvh;
    padding:0;
    border:0;
    border-left:1px solid rgba(201,170,115,.28);
    border-radius:0;
    background:transparent;
    color:#f4efe6;
    box-shadow:none;
    overflow:auto;
    overscroll-behavior:contain;
    scroll-padding:64px 0 24px;
    scrollbar-color:#8d6a3d transparent;
  }
  #ae-side-panel:not([open]) { display:none; }
  #ae-side-panel[open] { display:block; animation:aeSidePanelIn .24s ease-out; }
  #ae-side-panel::backdrop { background:transparent; backdrop-filter:none; -webkit-backdrop-filter:none; }
  #ae-side-panel-close {
    position:absolute;
    top:20px;
    right:12px;
    z-index:2;
    box-sizing:border-box;
    width:44px;
    height:44px;
    padding:0;
    border:1px solid rgba(201,170,115,.28);
    border-radius:50%;
    background:#151612;
    color:#f2eee5;
    font:24px/1 Arial,sans-serif;
    cursor:pointer;
  }
  #ae-side-panel-close:hover { border-color:#d7b875; background:#24261f; }
  #ae-side-panel .ae-side-panel-content { padding:56px 0 0; }
  /* Fit the original two-column interface into the requested 45vw panel. */
  #ae-side-panel #ae-container {
    grid-template-columns:clamp(218px, 42%, 280px) minmax(0, 1fr);
    gap:16px;
  }
  #ae-side-panel #ae-right {
    height:calc(100vh - 56px);
    height:calc(100dvh - 56px);
    min-height:0;
    max-height:none;
  }
  #ae-side-panel #ae-left {
    max-height:calc(100vh - 56px);
    max-height:calc(100dvh - 56px);
    overflow-y:auto;
    overscroll-behavior:contain;
  }
  #ae-side-panel .ae-topbar { flex-wrap:wrap; padding-right:72px; }
  /* Use the original stacked arrangement when the panel is too narrow
     for both columns, while keeping all of its content available. */
  @media (max-width:1199px) {
    #ae-side-panel #ae-container { grid-template-columns:1fr; gap:24px; }
    #ae-side-panel #ae-left { max-height:none; }
    #ae-side-panel #ae-right { height:680px; min-height:680px; max-height:680px; }
  }
  @media (max-width:600px) {
    #ae-floating-chat-button { right:16px; bottom:20px; padding-right:17px; }
    #ae-side-panel {
      width:100vw;
      max-width:100vw;
      border-left:0;
    }
    #ae-side-panel .ae-side-panel-content { padding-top:54px; }

  }
  @keyframes aeSidePanelIn {
    from { transform:translateX(40px); opacity:0; }
    to { transform:translateX(0); opacity:1; }
  }
  @media (prefers-reduced-motion:reduce) {
    #ae-side-panel[open] { animation:none; }
  }

  <script>
(() => {
  'use strict';
  const root = document.getElementById('ask-elena-shell');
  if (!root || root.dataset.elenaEmbedReady === '1') return;
  root.dataset.elenaEmbedReady = root.dataset.elenaReady = '1';
  const byId = id => document.getElementById(id);
  const dialog = byId('ae-side-panel'), video = byId('ae-live-video');
  const callButton = byId('ae-call'), faceButton = byId('ae-face-button');
  const status = byId('ae-call-status'), chat = byId('ae-chat');
  const input = byId('ae-input'), send = byId('ae-send');
  let current = null;
  const hello = "Welcome to The Orozco Realty! I’m Elena. Are you looking to buy, sell, plan a military move, or learn about the platform? Choose a section, tap my portrait to talk, or type below. Anam processes voice and typed conversations.";
  const destinations = new Map(Array.from(root.querySelectorAll('.ae-links a'), link =>
    [link.textContent.trim().toLowerCase(), link.href]));
  function writeMessage(line, role, text) {
    line.replaceChildren();
    if (role !== 'persona') { line.textContent = text; return; }
    for (const part of text.split(/\b(About Us|Military|Buy|Sell)\b/gi)) {
      const url = destinations.get(part.toLowerCase());
      if (!url) { line.append(part); continue; }
      const link = document.createElement('a');
      link.href = url;
      link.textContent = part;
      link.style.color = 'inherit';
      line.append(link);
    }
  }
  function bubble(role, text) {
    const line = document.createElement('div');
    line.className = 'ae-msg ' + (role === 'user' ? 'ae-user' : 'ae-bot');
    writeMessage(line, role, text);
    chat.append(line);
    chat.scrollTop = chat.scrollHeight;
    return line;
  }
  function render(message = '') {
    const label = current ? (current.ready ? 'End conversation' : 'Cancel connection') : 'Talk to Elena';
    callButton.textContent = label;
    faceButton.setAttribute('aria-label', label);
    status.textContent = message;
    send.disabled = !!current && !current.ready;
  }
  function stop(message = '') {
    const call = current;
    current = null;
    if (call) {
      call.abort.abort();
      clearTimeout(call.timer);
      call.mic?.getTracks().forEach(track => track.stop());
      if (call.client) Promise.resolve(call.client.stopStreaming()).catch(() => {});
    }
    video.pause(); video.srcObject = null;
    video.classList.remove('ae-playing');
    render(message);
  }
  function failMessage(error) {
    if (error.name === 'NotAllowedError' || /microphone_permission_denied/i.test(error.message)) return 'Allow microphone access to talk, or type a question below.';
    if (error.name === 'NotFoundError') return 'No microphone was found. You can still type a question.';
    if (/capacity|concurren|quota|credits|limit|429/i.test(error.message)) return 'Elena is at her call limit. Please try again later.';
    if (/403|origin/i.test(error.message)) return 'Anam could not authorize a call from this website.';
    return 'Elena couldn’t connect. Check your connection and try again.';
  }
  async function start(useMic) {
    if (current || !dialog.open) return null;
    const call = {abort: new AbortController(), ready: false, mic: null, client: null, messages: new Map()};
    current = call;
    render(useMic ? 'Allow your microphone to talk with Elena.' : 'Connecting to Elena…');
    try {
      if (useMic) {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('Microphone unavailable');
        const mic = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true}, video: false});
        if (current !== call) { mic.getTracks().forEach(track => track.stop()); return null; }
        call.mic = mic;
      }
      render('Connecting to Elena…');
      call.timer = setTimeout(() => { if (current === call) stop('The connection timed out. Try again.'); }, 45000);
      const [sdk, response] = await Promise.all([
        import('https://cdn.jsdelivr.net/npm/@anam-ai/js-sdk@4.29.3/+esm'),
        fetch('https://api.anam.ai/v1/auth/widget', {method:'POST', credentials:'omit', signal:call.abort.signal, headers:{'Content-Type':'application/json'}, body:JSON.stringify({agentId:'8a347f9e-a615-48fc-845f-7cdc81eb78d7'})})
      ]);
      if (!response.ok) throw new Error('Anam '+response.status);
      const {sessionToken} = await response.json();
      if (current !== call) return null;
      if (!sessionToken) throw new Error('Missing session');
      const client = call.client = sdk.createClient(sessionToken, {disableInputAudio: !useMic});
      // Wait for Anam's dialogue engine; the first video frame can arrive before it is ready for a question.
      const waitFor = register => new Promise(resolve => {
        register(resolve);
        call.abort.signal.addEventListener('abort', resolve, {once:true});
      });
      const engineReady = waitFor(done => client.addListener(sdk.AnamEvent.SESSION_READY, done));
      const greeting = useMic ? Promise.resolve() : waitFor(done => {
        client.addListener(sdk.AnamEvent.MESSAGE_HISTORY_UPDATED, history => {
          if (history.some(item => item.role === 'persona' && item.content)) done();
        });
      });
      client.addListener(sdk.AnamEvent.CONNECTION_CLOSED, (reason, details) => {
        if (current === call) stop(call.ready ? 'Conversation ended.' : failMessage(new Error(String(reason)+' '+String(details || ''))));
      });
      client.addListener(sdk.AnamEvent.MESSAGE_HISTORY_UPDATED, history => {
        if (current !== call) return;
        for (const item of history) {
          if (!item.content || !item.id || !['user','persona'].includes(item.role)) continue;
          let line = call.messages.get(item.id);
          if (!line) { line = bubble(item.role,item.content); call.messages.set(item.id,line); }
          else if (line.textContent !== item.content) writeMessage(line, item.role, item.content);
        }
      });
      await Promise.all([client.streamToVideoElement(video.id, call.mic || undefined), engineReady, greeting]);
      if (current !== call) { await client.stopStreaming(); return null; }
      clearTimeout(call.timer);
      call.ready = true;
      render(useMic ? 'Microphone on · Speak to Elena' : 'Keyboard conversation · Microphone off');
      return client;
    } catch (error) {
      if (current === call) stop(failMessage(error));
      return null;
    }
  }
  video.addEventListener('playing', () => { if (current) video.classList.add('ae-playing'); });
  root.querySelector('.ae-links').addEventListener('click', event => {
    if (event.target.closest('a')) stop();
  });
  function toggleCall() { if (current) stop('Conversation ended.'); else void start(true); }
  faceButton.addEventListener('click', toggleCall);
  callButton.addEventListener('click', toggleCall);
  async function typeQuestion() {
    const message = input.value.trim();
    if (!message || send.disabled) return;
    const client = current?.ready ? current.client : await start(false);
    if (!client || current?.client !== client) return;
    try { client.sendUserMessage(message); bubble('user', message); if (input.value.trim() === message) input.value = ''; }
    catch { status.textContent = 'Please try sending your question again.'; }
  }
  send.addEventListener('click', typeQuestion);
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); void typeQuestion(); } });
  function reset() { stop(); chat.replaceChildren(); input.value = ''; bubble('persona', hello); }
  dialog.addEventListener('close', reset);
  window.addEventListener('pagehide', () => stop());
  window.OrozcoAskElena = {open: () => byId('ae-floating-chat-button').click(), close: () => dialog.close(), reset};
  reset();
})();
</script>
</div>
  </div>
</dialog>

<script>
(() => {
  const button = document.getElementById("ae-floating-chat-button");
  const popup = document.getElementById("ae-side-panel");
  const closeButton = document.getElementById("ae-side-panel-close");
  let savedOverflow = null;
  let pressedOutside = false;

  button.addEventListener("click", () => {
    if (popup.open) return;
    popup.showModal();
    savedOverflow = {
      value:document.documentElement.style.getPropertyValue("overflow"),
      priority:document.documentElement.style.getPropertyPriority("overflow")
    };
    document.documentElement.style.setProperty("overflow", "hidden");
    button.setAttribute("aria-expanded", "true");
    const chat = document.getElementById("ae-chat");
    if (chat) chat.scrollTop = chat.scrollHeight;
  });

  // Keep focused original controls visible when the popup needs to scroll.
  popup.addEventListener("focusin", (event) => {
    if (event.target !== closeButton) {
      event.target.scrollIntoView({ behavior:"instant", block:"nearest", inline:"nearest" });
    }
  });

  closeButton.addEventListener("click", () => popup.close());
  // Escape uses the browser's native dialog behavior.
  popup.addEventListener("close", () => {
    button.setAttribute("aria-expanded", "false");
    if (savedOverflow) {
      if (savedOverflow.value) {
        document.documentElement.style.setProperty("overflow", savedOverflow.value, savedOverflow.priority);
      } else {
        document.documentElement.style.removeProperty("overflow");
      }
      savedOverflow = null;
    }
    pressedOutside = false;
    button.focus({ preventScroll:true });
  });

  function isOutside(event) {
    const rect = popup.getBoundingClientRect();
    return event.clientX < rect.left || event.clientX > rect.right ||
      event.clientY < rect.top || event.clientY > rect.bottom;
  }
  popup.addEventListener("pointerdown", (event) => {
    pressedOutside = event.target === popup && isOutside(event);
  });
  popup.addEventListener("pointercancel", () => { pressedOutside = false; });
  popup.addEventListener("click", (event) => {
    if (pressedOutside && event.target === popup && isOutside(event)) popup.close();
    pressedOutside = false;
  });
})();
</script>
