<!-- ============================================================
  PCSUnited • Financial Analysis CTA
  Full-Width Narrow Footer Button
  Opens Destination Outside Embedded Frame
=============================================================== -->

<div id="pcsu-analysis-cta">
  <label class="pcsu-budget-review"><input id="pcsu-budget-reviewed" type="checkbox" disabled> <span>I reviewed all four expense categories, including housing, debts and savings. Zero amounts do not apply to me.</span></label>
  <a
    id="pcsu-analysis-link"
    class="pcsu-analysis-link"
    href="https://pcs-united-com.webflow.io/financial-analysis"
    target="_blank"
    rel="opener"
    aria-label="Open your financial analysis in a new tab"
  >
    <span class="pcsu-analysis-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M5 19V11"></path>
        <path d="M10 19V7"></path>
        <path d="M15 19V13"></path>
        <path d="M20 19V4"></path>
      </svg>
    </span>

    <span class="pcsu-analysis-text">
      Provide Financial Analysis
    </span>

    <span class="pcsu-analysis-arrow" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M5 12h13"></path>
        <path d="m14 7 5 5-5 5"></path>
      </svg>
    </span>
  </a>
</div>

<style>
  #pcsu-analysis-cta,
  #pcsu-analysis-cta *,
  #pcsu-analysis-cta *::before,
  #pcsu-analysis-cta *::after {
    box-sizing: border-box;
  }

  #pcsu-analysis-cta {
    display: block;
    width: 100%;
    max-width: none;
    min-width: 0;
    padding: 6px 10px;

    font-family:
      Inter,
      Barlow,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Arial,
      sans-serif;
  }

  #pcsu-analysis-cta .pcsu-budget-review { display:flex; align-items:flex-start; gap:10px; margin:0 0 12px; padding:12px; border:1px solid #b9aaa0; border-radius:10px; background:#faf9f6; color:#17334d; font-size:14px; line-height:1.5; cursor:pointer; }
  #pcsu-analysis-cta .pcsu-budget-review input { flex:0 0 20px; width:20px; height:20px; margin:1px 0 0; accent-color:#17334d; }
  #pcsu-analysis-cta .pcsu-analysis-link {
    position: relative;
    isolation: isolate;

    display: flex;
    width: 100%;
    min-width: 0;
    height: 44px;

    align-items: center;
    justify-content: center;
    gap: 10px;

    overflow: hidden;

    color: #f5f2e9;
    text-decoration: none;
    cursor: pointer;

    background:
      radial-gradient(
        circle at 50% -80%,
        rgba(222, 184, 87, 0.17),
        transparent 60%
      ),
      linear-gradient(
        180deg,
        #202126 0%,
        #141518 100%
      );

    border: 1px solid rgba(214, 175, 76, 0.42);
    border-radius: 10px;

    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.055),
      0 7px 18px rgba(0, 0, 0, 0.25),
      0 0 0 rgba(214, 175, 76, 0);

    transition:
      transform 220ms ease,
      border-color 220ms ease,
      box-shadow 220ms ease;
  }

  /* Restrained animated light sweep */
  #pcsu-analysis-cta .pcsu-analysis-link::before {
    content: "";
    position: absolute;
    z-index: -1;

    top: -35px;
    bottom: -35px;
    left: -45%;
    width: 28%;

    pointer-events: none;

    background:
      linear-gradient(
        90deg,
        transparent,
        rgba(255, 228, 159, 0.04),
        rgba(255, 228, 159, 0.20),
        rgba(255, 228, 159, 0.04),
        transparent
      );

    opacity: 0;
    transform: skewX(-20deg);

    animation:
      pcsu-analysis-sweep 5.5s ease-in-out infinite;
  }

  /* Interior depth */
  #pcsu-analysis-cta .pcsu-analysis-link::after {
    content: "";
    position: absolute;
    inset: 0;

    pointer-events: none;
    border-radius: inherit;

    box-shadow:
      inset 0 0 16px rgba(214, 175, 76, 0.025),
      inset 0 -1px 0 rgba(0, 0, 0, 0.55);
  }

  #pcsu-analysis-cta .pcsu-analysis-icon {
    display: grid;
    width: 24px;
    height: 24px;
    flex: 0 0 24px;

    place-items: center;

    color: #dfbb60;
    background: rgba(214, 175, 76, 0.09);

    border: 1px solid rgba(214, 175, 76, 0.25);
    border-radius: 7px;

    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  #pcsu-analysis-cta .pcsu-analysis-icon svg,
  #pcsu-analysis-cta .pcsu-analysis-arrow svg {
    width: 14px;
    height: 14px;

    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #pcsu-analysis-cta .pcsu-analysis-text {
    overflow: hidden;

    color: #f5f2e9;

    font-size: 13px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0.02em;

    text-align: center;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #pcsu-analysis-cta .pcsu-analysis-arrow {
    display: grid;
    width: 18px;
    height: 18px;
    flex: 0 0 18px;

    place-items: center;

    color: rgba(223, 187, 96, 0.9);

    transition:
      transform 220ms ease;
  }

  #pcsu-analysis-cta .pcsu-analysis-link:hover {
    transform: translateY(-1px);

    border-color: rgba(229, 194, 105, 0.72);

    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.07),
      0 9px 22px rgba(0, 0, 0, 0.30),
      0 0 20px rgba(214, 175, 76, 0.11);
  }

  #pcsu-analysis-cta
    .pcsu-analysis-link:hover
    .pcsu-analysis-arrow {
    transform: translateX(3px);
  }

  #pcsu-analysis-cta .pcsu-analysis-link:active {
    transform: translateY(0) scale(0.995);
  }

  #pcsu-analysis-cta .pcsu-analysis-link:focus-visible {
    outline: 2px solid rgba(229, 194, 105, 0.92);
    outline-offset: 2px;
  }

  @keyframes pcsu-analysis-sweep {
    0%,
    18% {
      left: -45%;
      opacity: 0;
    }

    30% {
      opacity: 0.65;
    }

    58%,
    100% {
      left: 120%;
      opacity: 0;
    }
  }

  @media (max-width: 480px) {
    #pcsu-analysis-cta {
      padding: 5px 7px;
    }

    #pcsu-analysis-cta .pcsu-budget-review { display:flex; align-items:flex-start; gap:10px; margin:0 0 12px; padding:12px; border:1px solid #b9aaa0; border-radius:10px; background:#faf9f6; color:#17334d; font-size:14px; line-height:1.5; cursor:pointer; }
  #pcsu-analysis-cta .pcsu-budget-review input { flex:0 0 20px; width:20px; height:20px; margin:1px 0 0; accent-color:#17334d; }
  #pcsu-analysis-cta .pcsu-analysis-link {
      height: 42px;
      gap: 8px;
    }

    #pcsu-analysis-cta .pcsu-analysis-text {
      font-size: 12px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #pcsu-analysis-cta .pcsu-analysis-link::before {
      animation: none;
    }

    #pcsu-analysis-cta .pcsu-analysis-link,
    #pcsu-analysis-cta .pcsu-analysis-arrow {
      transition: none;
    }
  }
</style>

<script>
/* Section 04: memory-only handoff to the user's Financial Analysis tab. */
(() => {
  'use strict';
  function init() {
    const link = document.getElementById('pcsu-analysis-link');
    if (!link || link.dataset.analysisBridge === '1') return;
    link.dataset.analysisBridge = '1';
    const budgetFrame = document.getElementById('pcsu-budget-frame');
    const mortgageFrame = document.getElementById('pcsu-mortgage-frame');
    const destination = new URL(link.href), appOrigin = new URL(budgetFrame?.src || 'https://thewing.netlify.app').origin;
    let analysisWindow = null, receiverId = null, revision = 0, budget = null, mortgage = null;
    let budgetRevision = -1, mortgageRevision = -1;
    const message = document.createElement('p');
    message.id = 'pcsu-analysis-status'; message.setAttribute('role','status'); message.hidden = true;
    message.style.cssText = 'margin:8px 10px;color:#17334d;font:13px/1.5 Arial,sans-serif';
    link.parentElement.append(message);
    function status(text) { message.textContent = text; message.hidden = !text; }
    function pick(value, keys) { return Object.fromEntries(keys.filter(key => value?.[key] !== undefined).map(key => [key,value[key]])); }
    function small(value) { try { return value && JSON.stringify(value).length < 80000; } catch (_) { return false; } }
    function income() {
      const value = window.PCSU_FINANCIAL_INCOME?.getSnapshot?.();
      if (!value) return null;
      const snapshot=pick(value,['schemaVersion','complete','status','audience','entryMethod','currency','period','containsEstimates','grossMonthlyIncome','monthlyDeductions','netMonthlyIncome','monthlySavingsContributions','availableAfterSavings','capitalReservesTotal']);
      snapshot.sources=Array.isArray(value.sources)?value.sources.slice(0,50).map(source=>pick(source,['label','amount','basis'])):[];
      return snapshot;
    }
    function send() {
      if (!analysisWindow || analysisWindow.closed || !receiverId) return;
      analysisWindow.postMessage({source:'pcsu-analysis-launch',version:1,type:'pcsu:analysis-context',requestId:receiverId,revision:++revision,
        context:{version:1,income:income(),mortgage,budget}},destination.origin);
    }
    function requestBudget() {
      budgetFrame?.contentWindow?.postMessage({source:'pcsu-finance-host',version:1,type:'pcsu:finance-analysis-request',requestId:crypto.randomUUID()},appOrigin);
    }
    const review=document.getElementById('pcsu-budget-reviewed');
    review?.addEventListener('change',()=>{
      budget=null;send();
      budgetFrame?.contentWindow?.postMessage({source:'pcsu-finance-host',version:1,type:'pcsu:finance-review',reviewed:review.checked},appOrigin);
    });
    function requestFrames() {
      mortgageFrame?.contentWindow?.postMessage({source:'pcsu-finance-host',version:1,type:'pcsu:mortgage-budget-request'},appOrigin);
      requestBudget();
    }
    function open(event) {
      event.preventDefault();
      if (analysisWindow && !analysisWindow.closed) { analysisWindow.focus(); send(); requestFrames(); return; }
      receiverId = null;
      analysisWindow = window.open(destination.href,'pcsu-analysis-'+crypto.randomUUID());
      if (!analysisWindow) { status('Allow a new tab to open your analysis. Your entries remain on this page.'); return; }
      status('Financial Analysis opens in a new tab. Keep this page open to keep your figures connected.');
      requestFrames();
    }
    link.addEventListener('click',open);
    link.addEventListener('auxclick',event => { if (event.button === 1) open(event); });
    window.addEventListener('message',event => {
      const data = event.data;
      if (!data || data.version !== 1) return;
      if (event.source === analysisWindow && event.origin === destination.origin && data.source === 'pcsu-analysis-page'
          && data.type === 'pcsu:analysis-ready' && typeof data.requestId === 'string' && data.requestId.length <= 100) {
        receiverId = data.requestId; send(); requestFrames(); return;
      }
      if (event.origin !== appOrigin) return;
      if (event.source === budgetFrame?.contentWindow && data.source === 'pcsu-finance') {
        if (data.type === 'pcsu:finance-ready') { requestBudget(); return; }
        const value = data.snapshot;
        if (data.type !== 'pcsu:finance-analysis-state' || !small(value) || !Number.isInteger(value.revision) || value.revision < budgetRevision) return;
        budgetRevision = value.revision; budget = value; if(review){review.disabled=value.status==='loading';review.checked=value.state?.reviewed===true;} send();
      }
      if (event.source === mortgageFrame?.contentWindow && data.source === 'pcsu-mortgage-budget' && data.type === 'pcsu:mortgage-budget-state') {
        const value = data.snapshot;
        if (!value || !Number.isInteger(value.revision) || value.revision < mortgageRevision) return;
        mortgageRevision = value.revision;
        mortgage = pick(value,['ready','status','revision','homePrice','downPayment','creditScore','interestRate','termYears','propertyTaxAnnual','insuranceAnnual','hoaMonthly','otherOwnershipMonthly','pmiMonthly','loanType','vaFeeStatus','feePayment','emergencyFund','emergencyFundBasis','emergencyFundUserEntered','hasUserInteracted','closingCosts','prepaidsEscrow','cashAvailable','moveInCosts']);
        budget = null; send(); requestBudget();
      }
    });
    window.addEventListener('pcsu:financial-income-change',() => { budget = null; send(); requestBudget(); });
    budgetFrame?.addEventListener('load',() => { budgetRevision = -1; budget = null; send(); requestBudget(); });
    mortgageFrame?.addEventListener('load',() => { mortgageRevision = -1; mortgage = null; budget = null; send(); requestFrames(); });
    requestFrames();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',init,{once:true}); else init();
})();

</script>
