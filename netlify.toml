[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = [
    "netlify/functions/_share/**",
    "netlify/functions/data/**",
    "netlify/functions/cities/**"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# NOTE (Ask Amy v1.5):
# Removed wildcard Access-Control-Allow-Origin headers for /api/* and
# /.netlify/functions/* so endpoints can enforce strict origin allowlists.
# agent-amy.js sets CORS per-request and never falls back to "*".
