  #ae-side-panel-close:focus-visible { outline:2px solid #d7b875; outline-offset:4px; }

  #ae-side-panel {
    box-sizing:border-box;
    position:fixed;
    inset:0 0 0 auto;
    margin:0;
    width:45vw;
    max-width:100vw;
    height:100vh;
    height:100dvh;
    max-height:100vh;
    max-height:100dvh;
    padding:0;
    border:0;
    border-left:1px solid rgba(201,170,115,.28);
    border-radius:0;
    background:transparent;

    overflow:auto;
    overscroll-behavior:contain;
    scroll-padding:64px 0 24px;
    scrollbar-color:#8d6a3d transparent;
  }
  #ae-side-panel:not([open]) { display:none; }
  #ae-side-panel[open] { display:block; animation:aeSidePanelIn .24s ease-out; }
  #ae-side-panel::backdrop { background:transparent; backdrop-filter:none; -webkit-backdrop-filter:none; }
  #ae-side-panel-close {
    position:absolute;
    top:20px;
    right:12px;
    z-index:2;

    background:#151612;
    color:#f2eee5;
    font:24px/1 Arial,sans-serif;
    cursor:pointer;
  }
  #ae-side-panel-close:hover { border-color:#d7b875; background:#24261f; }
  #ae-side-panel .ae-side-panel-content { padding:56px 0 0; }
  /* Fit the original two-column interface into the requested 45vw panel. */
  #ae-side-panel #ae-container {
    grid-template-columns:clamp(218px, 42%, 280px) minmax(0, 1fr);
    gap:16px;
  }
  #ae-side-panel #ae-right {
    height:calc(100vh - 56px);
    height:calc(100dvh - 56px);
    min-height:0;
    max-height:none;
  }
  #ae-side-panel #ae-left {
    max-height:calc(100vh - 56px);
    max-height:calc(100dvh - 56px);

  }
  #ae-side-panel .ae-topbar { flex-wrap:wrap; padding-right:72px; }
  /* Use the original stacked arrangement when the panel is too narrow
     for both columns, while keeping all of its content available. */

    #ae-side-panel #ae-container { grid-template-columns:1fr; gap:24px; }
    #ae-side-panel #ae-left { max-height:none; }

  <script>
  (() => {
    const root = document.getElementById("ask-elena-shell");
    const RAW_ENDPOINT = root.getAttribute("data-endpoint") || "";
    const chatEl = document.getElementById("ae-chat");
    const inputEl = document.getElementById("ae-input");
    const sendBtn = document.getElementById("ae-send");
    function resolveAskEndpoint(raw) {
      if (location.hostname && /webflow\.io$/i.test(location.hostname)) {
        return "https://theorozcorealty.netlify.app/.netlify/functions/ask-elena";
      }
      if (!raw) return "/.netlify/functions/ask-elena";
      return raw;
    }

    const ENDPOINT = resolveAskEndpoint(RAW_ENDPOINT);

    const prefersReduced = () =>
      window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function clean(v) {
      return String(v == null ? "" : v).trim();
    }

    async function pushMsg(role, content, opts = {}) {
      const { typewriter = false, speed = 18, delay = 120 } = opts;

      const msg = document.createElement("div");
      msg.className = "ae-msg " + (role === "user" ? "ae-user" : "ae-bot");

      const textNode = document.createElement("span");
      msg.appendChild(textNode);
      chatEl.appendChild(msg);
      scrollToBottom();

      if (!typewriter || prefersReduced() || role === "user") {
        textNode.textContent = content;
        scrollToBottom();
        return;
      }

      await typewriterInto(textNode, content, speed, delay);
      scrollToBottom();
    }

    function showTyping() {
      const t = document.createElement("div");
      t.className = "ae-msg ae-bot ae-typing";
      t.id = "ae-typing";
      t.textContent = "Elena is reviewing your question…";
      chatEl.appendChild(t);
      scrollToBottom();
    }

    function hideTyping() {
      const t = document.getElementById("ae-typing");
      if (t) t.remove();
    }

    function typewriterInto(el, text, speed = 18, startDelay = 120) {
      return new Promise((resolve) => {
        el.textContent = "";
        const caret = document.createElement("span");
        caret.className = "tw-caret";
        el.appendChild(caret);

        let i = 0;
        const tick = () => {
          if (i < text.length) {
            caret.insertAdjacentText("beforebegin", text.charAt(i++));
            scrollToBottom();
            setTimeout(tick, speed);
          } else {
            caret.remove();
            resolve();
          }
        };
        setTimeout(tick, startDelay);
      });
    }

    async function callElena(userText) {
      sendBtn.disabled = true;
      showTyping();

      try {
        const payload = { message: userText };

        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));
        hideTyping();

        if (!res.ok || !data || data.ok !== true) {
          throw new Error((data && data.error) || "Request failed.");
        }

        const reply = String(data.reply || "I’m here. What would you like to explore?");
        const ui = data.ui || {};
        const speed = Number(ui.speed || 18);
        const delay = Number(ui.startDelay || 120);

        await pushMsg("assistant", reply, { typewriter: true, speed, delay });

      } catch (err) {
        hideTyping();
        await pushMsg(
          "assistant",
          "Hmm… I hit a connection snag. Please make sure this widget is calling /.netlify/functions/ask-elena.",
          { typewriter: true, speed: 16, delay: 80 }
        );
      } finally {
        sendBtn.disabled = false;
      }
    }

    async function trySend() {
      const text = clean(inputEl.value);
      if (!text) return;

      await pushMsg("user", text);
      inputEl.value = "";
      await callElena(text);
    }

    if (sendBtn) sendBtn.addEventListener("click", trySend);

    if (inputEl) {
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          trySend();
        }
      });
    }

    const greeting =
      "Hey — I’m Elena, your OrozcoRealty concierge. Ask me about Texas real estate, affordability, monthly payments, buyer or seller strategy, or a market like San Antonio or McAllen.";
    pushMsg("assistant", greeting, { typewriter: true, speed: 18, delay: 220 });
  })();
  </script>
</div>
  </div>
</dialog>

<script>
(() => {
  const button = document.getElementById("ae-floating-chat-button");
  const popup = document.getElementById("ae-side-panel");
  const closeButton = document.getElementById("ae-side-panel-close");
  let savedOverflow = null;
  let pressedOutside = false;

  button.addEventListener("click", () => {
    if (popup.open) return;
    popup.showModal();
    savedOverflow = {
      value:document.documentElement.style.getPropertyValue("overflow"),
      priority:document.documentElement.style.getPropertyPriority("overflow")
    };
    document.documentElement.style.setProperty("overflow", "hidden");
    button.setAttribute("aria-expanded", "true");
    const chat = document.getElementById("ae-chat");
    if (chat) chat.scrollTop = chat.scrollHeight;
  });

  // Keep focused original controls visible when the popup needs to scroll.
  popup.addEventListener("focusin", (event) => {
    if (event.target !== closeButton) {
      event.target.scrollIntoView({ behavior:"instant", block:"nearest", inline:"nearest" });
    }
  });

  closeButton.addEventListener("click", () => popup.close());
  // Escape uses the browser's native dialog behavior.
  popup.addEventListener("close", () => {
    button.setAttribute("aria-expanded", "false");
    if (savedOverflow) {
      if (savedOverflow.value) {
        document.documentElement.style.setProperty("overflow", savedOverflow.value, savedOverflow.priority);
      } else {
        document.documentElement.style.removeProperty("overflow");
      }
      savedOverflow = null;
    }
    pressedOutside = false;
    button.focus({ preventScroll:true });
  });

  function isOutside(event) {
    const rect = popup.getBoundingClientRect();
    return event.clientX < rect.left || event.clientX > rect.right ||
      event.clientY < rect.top || event.clientY > rect.bottom;
  }
  popup.addEventListener("pointerdown", (event) => {
    pressedOutside = event.target === popup && isOutside(event);
  });
  popup.addEventListener("pointercancel", () => { pressedOutside = false; });
  popup.addEventListener("click", (event) => {
    if (pressedOutside && event.target === popup && isOutside(event)) popup.close();
    pressedOutside = false;
  });
})();
</script>
